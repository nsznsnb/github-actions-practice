name: Literals
on: push
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - run: printenv | grep 'LITERAL_'
        env:
          LITERAL_NULL: ${{ null }}
          LETERAL_BOOLEAN: ${{ true }}
          LETERAL_NUMBER: ${{ 1234}}
          LETERAL_STRING: ${{ 'Hello'}}
          LETERAL_OMIT_STRING: World
